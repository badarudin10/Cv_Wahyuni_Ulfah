<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wahyuni Ulfah Portofolio</title>
<style>
:root {
  --navy: #2c3e50;
  --navy-dark: #1c2833;
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #2b2b2b;
  --muted: #6b7280;
  --line: #e3e6ea;
  --accent: #c9a227;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d;
    --card: #1d2329;
    --text: #e7e9ec;
    --muted: #9aa4af;
    --line: #2a323b;
  }
}

:root[data-theme="dark"] {
  --bg: #14181d;
  --card: #1d2329;
  --text: #e7e9ec;
  --muted: #9aa4af;
  --line: #2a323b;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scroll-behavior: smooth;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

img {
  max-width: 100%;
  display: block;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
}

/* HERO */
.hero {
  background: linear-gradient(135deg, var(--navy), var(--navy-dark));
  color: #fff;
  padding: 48px 20px 40px;
  text-align: center;
}

.hero .photo {
  width: 120px;
  height: 140px;
  object-fit: cover;
  border-radius: 16px;
  border: 4px solid rgba(255, 255, 255, 0.85);
  margin: 0 auto 16px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}

.hero h1 {
  font-size: 26px;
  margin: 0 0 6px;
  letter-spacing: 3px;
}

.hero .role {
  font-size: 12.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #c3cad1;
  margin: 0 0 18px;
}

.hero .contact-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 18px;
  font-size: 13px;
  color: #dfe3e7;
}

.hero .contact-row span {
  white-space: nowrap;
}

nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  white-space: nowrap;
}

nav.wrap {
  display: flex;
  gap: 6px;
  padding: 0 20px;
}

nav a {
  display: inline-block;
  padding: 14px 12px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
  border-bottom: 2px solid transparent;
}

nav a:hover {
  color: var(--navy);
}

section {
  padding: 34px 0;
}

section h2 {
  font-size: 19px;
  color: var(--navy);
  margin: 0 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

:root[data-theme="dark"] section h2, 
@media (prefers-color-scheme: dark) {
  section h2 {
    color: #fff;
  }
}

section h2 .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}

.about-text {
  font-size: 14.5px;
  color: var(--text);
  text-align: justify;
}

.skills-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.skill-chip {
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 12.5px;
  padding: 7px 12px;
  border-radius: 999px;
}

.exp-card .exp-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px;
}

.exp-title {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--navy);
}

:root[data-theme="dark"] .exp-title,
@media (prefers-color-scheme: dark) {
  .exp-title {
    color: #fff;
  }
}

.exp-period {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

.exp-company {
  font-size: 13px;
  font-style: italic;
  color: var(--muted);
  margin: 2px 0 10px;
}

.exp-card ul {
  margin: 0 0 14px 18px;
  padding: 0;
}

.exp-card li {
  font-size: 13px;
  margin-bottom: 5px;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.thumb {
  position: relative;
  width: 84px;
  height: 84px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line);
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.thumb .del {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: none;
  font-size: 12px;
  line-height: 20px;
  text-align: center;
  cursor: pointer;
  padding: 0;
}

.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.upload-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.upload-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

input[type="file"] {
  display: none;
}

footer {
  text-align: center;
  padding: 26px 20px 40px;
  font-size: 12px;
  color: var(--muted);
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  flex-shrink: 0;
}

.badge svg {
  width: 14px;
  height: 14px;
}
</style>
</head>
<body>
  <!-- Konten Portofolio Anda dapat dilanjutkan di sini -->
</body>
</html>
